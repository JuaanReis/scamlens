[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scamlens"
version = "1.7.1"
requires-python = ">=3.10"

dependencies = [
    "cairosvg==2.9.0",
    "colorama==0.4.6",
    "cryptography==49.0.0",
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "ipwhois==1.3.0",
    "Pillow==12.3.0",
    "pydantic==2.13.4",
    "PyJWT>=2.10.1",
    "python-dotenv==1.2.2",
    "bcrypt>=4.0.1",
    "selectolax==0.4.7",
    "slowapi==0.1.10",
    "starlette==1.3.1",
    "tldextract==5.3.1",
    "tomli==2.4.1",
    "uvicorn==0.47.0",
    "zxing_cpp==3.0.0",
    "pydantic[email]",
    "python-multipart"
]

[project.scripts]
scurl = "plugins.scurl.cli.main:main"
scamlens-api = "api.server:run"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "plugins*",
    "api*",
    "providers*",
    "scamLens*",
    "docs*",
]

[tool.setuptools.package-data]
"scamLens" = ["config.toml"]
"providers.database" = ["schema/*.sql", "storage/*.db"]
api = ["static/*"]