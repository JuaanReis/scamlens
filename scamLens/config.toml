[server]
host = "0.0.0.0"
port = 8000
workers = 1
reload = false
logs = true

[cors]
enabled = true
allow_credentials = true
max_age = 600
expose_headers = []
allow_methods = ["*"]
allow_headers = ["*"]
allow_origins = [
    "http://localhost:8000"
]

[cache]
enabled = true

[rate_limit]
enabled = true
requests_per_minute = 10

[cookies]
secure = true
samesite = "lax"
httponly = true

[logging]
trust_proxy = false