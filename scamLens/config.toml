[server]
host = "0.0.0.0"
port = 8000
workers = 1
reload = false
logs = true

[cors]
enabled = true
allow_credentials = true
max_age = 600
expose_headers = []
allow_methods = ["*"]
allow_headers = ["*"]
allow_origins = []

[rate_limit]
enabled = true
requests_per_minute = 10

[cookies]
secure = true
samesite = "lax"
httponly = true
ttl_minutes = 30 # access token
ttl_days = 30 # refresh token

[http]
retries = 3
follow_redirects = true
verify_ssl = true
http2 = false
max_redirects = 10
timeout = 6.0
connect = 1.5
read = 3.0
max_keepalive_connections = 20
max_connections = 50
rotate_user_agent = true

[logging]
trust_proxy = false

[paths]
storage = "providers/storage"
avatar = "providers/storage/avatars"
logs = "providers/storage/logs"
static = "api/static"
scamlens_db_path = "providers/storage/db/scamlens.db"

[rdap]
max_concurrent_per_server = 8
fallback_max_concurrent = 4

[scurl]
[scurl.scanner]
timeout = 6.0
threads = 3
cache = true
k = 5

[scurl.output]
colors = true

[scurl.security]
allow_private_ips = false
allow_localhost = false