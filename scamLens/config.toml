[server]
host = "0.0.0.0"
port = 5300
workers = 1
reload = false

[logs]
enabled = true
level = "INFO"

[logging]
trust_proxy = false

[domain]
cache_size = 4096

[cors]
enabled = true
allow_credentials = true
max_age = 600
expose_headers = ["*"]
allow_methods = ["*"]
allow_headers = ["*"]
allow_origins = ["*"]

[rate_limit]
enabled = true
requests_per_minute = 10
max_concurrent_scans = 20

[cookies]
secure = true
samesite = "lax"
httponly = true
ttl_minutes = 30 # access token
ttl_days = 30 # refresh token

[http]
retries = 3
follow_redirects = true
verify_ssl = true
http2 = false
max_redirects = 10
timeout = 6.0
connect = 1.5
read = 3.0
max_keepalive_connections = 20
max_connections = 50
rotate_user_agent = true
max_body_bytes = 2097152

[rdap]
http2 = false
verify = true
follow_redirects = true
connect = 2.0
read = 3.0
write = 2.0
pool = 1.0
max_keepalive_connections = 20
max_connections = 120
max_concurrent_per_server = 16
fallback_max_concurrent = 8

[paths]
storage = "providers/storage"
avatar = "providers/storage/avatars"
logs = "providers/storage/logs"
static = "api/static"
scamlens_db_path = "providers/storage/db/scamlens.db"

[scurl]
[scurl.scanner]
timeout = 6.0
threads = 3
cache = true
k = 5
score_model = "grouped"
cache_ttl_seconds = 300
max_redirects = 10
retries = 3

[scurl.output]
colors = true

[scurl.security]
allow_private_ips = false
allow_localhost = false

[scfs]
[scfs.scanner]
max_file_size_bytes = 50000000

[scimg]
[scimg.scanner]
max_file_size_bytes = 30000000